# .github/workflows/weeklySummary.yml
# Generates the weekly AI signal summary post every Sunday.
#
# Flow: refresh the weekly signal (fetch-ai-news.js) → generate the post
# (generate-weekly-post.js) → commit both to main. If the fetch fails
# (API outage / rate limit), the generator falls back to the last
# data/weekly_signal.json committed by the daily job, so a post is still
# produced from the most recent good signal.

name: Weekly AI Signal Post

on:
  schedule:
    # Sundays at 13:00 UTC (7/8 AM Chicago)
    - cron: '0 13 * * 0'
  workflow_dispatch: # Allows manual triggering

# Allow pushing commits and opening issues
permissions:
  contents: write
  issues: write

jobs:
  generate-weekly-post:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Post dates are derived from local time; pin to Cathy's timezone so
      # the calendar date never depends on the runner's clock.
      TZ: America/Chicago

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate secrets
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_KEY" ] && missing="$missing SUPABASE_SERVICE_KEY"
          [ -z "$NEWS_API_KEY" ] && missing="$missing NEWS_API_KEY"
          if [ -n "$missing" ]; then
            echo "⚠️ Missing or empty secrets:$missing"
            echo "News fetching may fail; the post will fall back to the last committed signal."
          else
            echo "✅ All required secrets are present"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Install dependencies
        run: npm ci

      - name: Refresh Weekly Signal
        continue-on-error: true
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          NPR_API_KEY: ${{ secrets.NPR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WEEKLY_SIGNAL_PATH: data/weekly_signal.json
        run: node scripts/fetch-ai-news.js

      - name: Generate Weekly Summary Post
        run: node scripts/generate-weekly-post.js

      - name: Commit weekly post
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/weekly_signal.json content/weekly-summaries
          git diff --staged --quiet || git commit -m "🤖 Weekly AI signal post $(date +'%Y-%m-%d')"
          git push || echo "No changes to push"

      - name: Open GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];

            // De-duplicate: skip if an open failure issue already exists
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'weekly-post-failure',
              state: 'open',
            });

            if (open.length > 0) {
              console.log(`Issue already open: ${open[0].html_url} — skipping.`);
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## ❌ Weekly AI Signal Post Job Failed',
              '',
              `The scheduled workflow failed on **${today}**.`,
              '',
              `**[View run logs](${runUrl})**`,
              '',
              '## Likely causes',
              '',
              '1. `data/weekly_signal.json` is missing or malformed — check the "Generate Weekly Summary Post" step output',
              '2. A GitHub Secret is missing, expired, or was rotated — check the "Validate secrets" step in the logs',
              '3. An external news API is down or rate-limited',
              '',
              '## Secrets to verify',
              '',
              '`SUPABASE_URL` · `SUPABASE_SERVICE_KEY` · `NEWS_API_KEY` · `NYT_API_KEY`',
              '',
              'Update at: **Settings → Secrets and variables → Actions**',
              '',
              'After fixing, manually re-run the workflow and close this issue.',
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Weekly AI signal post job failed — ${today}`,
              body,
              labels: ['weekly-post-failure'],
            });

            console.log(`Opened issue: ${issue.html_url}`);
