name: API Key Health Check

on:
  schedule:
    # Every Monday at 8 AM UTC — runs an hour before the daily job so
    # problems are flagged before real data fetching starts that week.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run health check
        id: health
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node scripts/check-api-health.js

      - name: Open GitHub Issue on failure
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];

            // De-duplicate: don't open a new issue if one is already open
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'api-health-failure',
              state: 'open',
            });

            if (open.length > 0) {
              console.log(`Issue already open: ${open[0].html_url} — skipping.`);
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## ⚠️ API Key Health Check Failed',
              '',
              `One or more critical API keys failed validation on **${today}**.`,
              `The daily market & news job will continue failing until this is resolved.`,
              '',
              `**[View health-check logs](${runUrl})**`,
              '',
              '## What to check',
              '',
              '| Secret | Where to get a new key |',
              '|--------|------------------------|',
              '| `SUPABASE_URL` / `SUPABASE_SERVICE_KEY` | Supabase Dashboard → Settings → API |',
              '| `ALPHA_VANTAGE_KEY` | alphavantage.co → Account |',
              '| `NYT_API_KEY` | developer.nytimes.com → Apps |',
              '| `NEWS_API_KEY` | newsapi.org → Account *(optional)* |',
              '',
              'Update the failing secret at:',
              '**Settings → Secrets and variables → Actions → Repository secrets**',
              '',
              'After updating, re-run the [daily workflow]' +
                `(${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/dailyMarketUpdate.yml)` +
                ' manually to confirm the fix, then close this issue.',
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ API key health check failed — ${today}`,
              body,
              labels: ['api-health-failure'],
            });

            console.log(`Opened issue: ${issue.html_url}`);
