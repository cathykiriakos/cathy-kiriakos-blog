# .github/workflows/daily-market-update.yml
# Automated daily updates for market data and AI news

name: Daily Market & News Update

on:
  schedule:
    # Runs every day at 9 AM UTC (4 AM EST, 3 AM Chicago)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual triggering

# Allow pushing commits and opening issues
permissions:
  contents: write
  issues: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate secrets
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_KEY" ] && missing="$missing SUPABASE_SERVICE_KEY"
          [ -z "$ALPHA_VANTAGE_KEY" ] && missing="$missing ALPHA_VANTAGE_KEY"
          [ -z "$NEWS_API_KEY" ] && missing="$missing NEWS_API_KEY"
          if [ -n "$missing" ]; then
            echo "⚠️ Missing or empty secrets:$missing"
            echo "Market data and/or news fetching will be skipped or fail."
          else
            echo "✅ All required secrets are present"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Install dependencies
        run: npm ci

      - name: Fetch Market Data
        continue-on-error: true
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/fetch-market-data.js

      - name: Fetch AI News
        continue-on-error: true
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          NPR_API_KEY: ${{ secrets.NPR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/fetch-ai-news.js

      - name: Generate Daily Digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/generate-daily-digest.js

      - name: Commit updated data (optional - if storing in repo)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Daily market & news update $(date +'%Y-%m-%d')"
          git push || echo "No changes to push"

      - name: Open GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];

            // De-duplicate: skip if an open failure issue already exists
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'daily-job-failure',
              state: 'open',
            });

            if (open.length > 0) {
              console.log(`Issue already open: ${open[0].html_url} — skipping.`);
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## ❌ Daily Market & News Job Failed',
              '',
              `The scheduled workflow failed on **${today}**.`,
              '',
              `**[View run logs](${runUrl})**`,
              '',
              '## Likely causes',
              '',
              '1. A GitHub Secret is missing, expired, or was rotated — check the "Validate secrets" step in the logs',
              '2. An external API is down or rate-limited',
              '',
              '## Secrets to verify',
              '',
              '`SUPABASE_URL` · `SUPABASE_SERVICE_KEY` · `ALPHA_VANTAGE_KEY` · `NYT_API_KEY`',
              '',
              'Update at: **Settings → Secrets and variables → Actions**',
              '',
              'After fixing, manually re-run the workflow and close this issue.',
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Daily market job failed — ${today}`,
              body,
              labels: ['daily-job-failure'],
            });

            console.log(`Opened issue: ${issue.html_url}`);
